name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_VERSION: '1.0.0'
  FLUTTER_VERSION: '3.41.9'
  FLUTTER_OHOS_VERSION: '3.41.9+ohos-1.0.2'
  OHOS_CLI_VERSION: '26.0.0.821'

jobs:
  plugin:
    name: Plugin (check / test / pack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm test
      - run: npm run pack:local
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-plugin
          path: dsh-mobile-plugin-*.tgz

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SM="$(find "$SDK/cmdline-tools" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          if [ -z "$SM" ]; then echo "sdkmanager not found under $SDK"; exit 1; fi
          echo "$(dirname "$SM")" >> "$GITHUB_PATH"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release \
            --build-name "${{ env.APP_VERSION }}" --build-number "${{ github.run_number }}"
      - name: Collect artifact
        working-directory: app
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/DSH-Mobile-${{ env.APP_VERSION }}-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Mobile-android
          path: app/dist/*.apk

  ios:
    name: iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build iOS (no codesign)
        working-directory: app
        run: |
          flutter doctor -v
          flutter pub get
          flutter build ios --release --no-codesign --no-tree-shake-icons -v \
            --build-name "${{ env.APP_VERSION }}" --build-number "${{ github.run_number }}"
      - name: Dump Xcode errors
        if: failure()
        working-directory: app/ios
        run: |
          xcodebuild -version
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            build 2>&1 | grep -v '^\s*$' | tail -n 150
      - name: Package unsigned IPA
        working-directory: app
        run: |
          mkdir -p dist build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          (cd build/ios/ipa && zip -qry \
            "../../../dist/DSH-Mobile-${{ env.APP_VERSION }}-ios-unsigned.ipa" Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Mobile-ios
          path: app/dist/*.ipa

  harmonyos:
    name: HarmonyOS HAP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghc || true
          sudo docker image prune -af >/dev/null 2>&1 || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install libGL (HarmonyOS build dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev
      - name: Setup HarmonyOS command-line tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: ${{ env.OHOS_CLI_VERSION }}
          cache: true
      - name: Install flutter-ohos SDK
        run: |
          git clone --depth 1 --branch "$FLUTTER_OHOS_VERSION" \
            https://atomgit.com/CPF-Flutter/flutter_flutter.git "$HOME/flutter-ohos"
          echo "$HOME/flutter-ohos/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_STORAGE_BASE_URL=https://flutter-ohos.obs.cn-south-1.myhuaweicloud.com" >> "$GITHUB_ENV"
      - name: Patch flutter_cache (Huawei mirror lacks upstream engine artifacts)
        run: |
          F="$HOME/flutter-ohos/packages/flutter_tools/lib/src/flutter_cache.dart"
          sed -i 's|^    registerArtifact(FlutterEngineStamp(this, logger));|    // registerArtifact(FlutterEngineStamp(this, logger));|' "$F"
          sed -i '/for (final String artifactName in IosUsbArtifacts.artifactNames) {/,/registerArtifact(FontSubsetArtifacts(this, platform: platform));/s|^|// |' "$F"
          sed -i "s|const <String>\['sky_engine', 'flutter_gpu'\]|const <String>['sky_engine']|" "$F"
          grep -c "// registerArtifact(FlutterEngineStamp" "$F"
      - name: Cache flutter-ohos artifacts
        uses: actions/cache@v4
        with:
          path: ~/flutter-ohos/bin/cache
          key: flutter-ohos-${{ env.FLUTTER_OHOS_VERSION }}-${{ runner.os }}
      - name: Configure Flutter
        run: |
          flutter config --no-analytics
          flutter config --ohos-sdk "$HOS_SDK_HOME"
          flutter --version
          flutter precache --ohos
      - name: Build HAP (unsigned)
        working-directory: app
        run: |
          flutter pub get
          sed -i '/"signingConfig": "default",/d' ohos/build-profile.json5
          flutter build hap --release --no-codesign --no-tree-shake-icons \
            --build-name "${{ env.APP_VERSION }}" --build-number "${{ github.run_number }}"
      - id: signing-secrets
        name: Check signing secrets
        run: |
          if [ -n "$OHOS_KEYSTORE_BASE64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          OHOS_KEYSTORE_BASE64: ${{ secrets.OHOS_KEYSTORE_BASE64 }}
      - name: Sign HAP
        if: steps.signing-secrets.outputs.signed == 'true'
        working-directory: app
        env:
          OHOS_KEYSTORE_BASE64: ${{ secrets.OHOS_KEYSTORE_BASE64 }}
          OHOS_CERT_BASE64: ${{ secrets.OHOS_CERT_BASE64 }}
          OHOS_PROFILE_BASE64: ${{ secrets.OHOS_PROFILE_BASE64 }}
          OHOS_KEY_ALIAS: ${{ secrets.OHOS_KEY_ALIAS }}
          OHOS_KEY_PASSWORD: ${{ secrets.OHOS_KEY_PASSWORD }}
          OHOS_STORE_PASSWORD: ${{ secrets.OHOS_STORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/ohos-signing" dist
          cd "$RUNNER_TEMP/ohos-signing"
          echo "$OHOS_KEYSTORE_BASE64" | base64 -d > keystore.p12
          echo "$OHOS_CERT_BASE64" | base64 -d > app-cert.cer
          echo "$OHOS_PROFILE_BASE64" | base64 -d > profile.p7b
          HAP=$(find "$GITHUB_WORKSPACE/app" -name '*-unsigned.hap' | head -1)
          echo "Signing $HAP"
          java -jar "$HOS_SDK_HOME/default/openharmony/toolchains/lib/hap-sign-tool.jar" sign-app \
            -keyAlias "$OHOS_KEY_ALIAS" -signAlg SHA256withECDSA -mode localSign \
            -appCertFile app-cert.cer -profileFile profile.p7b \
            -inFile "$HAP" -keystoreFile keystore.p12 \
            -outFile "$GITHUB_WORKSPACE/app/dist/DSH-Mobile-${{ env.APP_VERSION }}-harmonyos-signed.hap" \
            -keyPwd "$OHOS_KEY_PASSWORD" -keystorePwd "$OHOS_STORE_PASSWORD"
      - name: Collect artifact
        working-directory: app
        run: |
          mkdir -p dist
          if [ -f "dist/DSH-Mobile-${{ env.APP_VERSION }}-harmonyos-signed.hap" ]; then
            exit 0
          fi
          find . -name '*-unsigned.hap' -exec cp {} \
            "dist/DSH-Mobile-${{ env.APP_VERSION }}-harmonyos-unsigned.hap" \;
      - uses: actions/upload-artifact@v4
        with:
          name: DSH-Mobile-harmonyos
          path: app/dist/*.hap

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [plugin, android, ios, harmonyos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
